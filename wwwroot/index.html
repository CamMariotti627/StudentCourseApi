<!DOCTYPE html>    <!--declares html file -->
<html lang="en">   <!--declares base lang-->
<head>             <!--decl head-->
    <meta charset="UTF-8">  <!--meta charset-->
    <title>Student Course Manager</title> <!--title set as Student Course Manager-->
</head>
<body>
    <h1>Student Courses</h1>                        
    <input id="search" placeholder="Search Code, Title, or Instructor">
    <button id="load">Search</button>      
    <table> 
        <thead>
            <tr><th>Code</th><th>Title</th><th>Credits</th></tr>
        </thead>
        <tbody id="courses"></tbody>               
    </table>

<script>

    document.querySelector('#load').addEventListener('click', async () => {                 //query selector uses "load" from button when clicked
        try {       //async=has await function - continues while waiting
            const searchText = document.querySelector('#search').value;
            const response = await fetch(`/api/courses?q=${encodeURIComponent(searchText)}`); 
            if (!response.ok) throw new Error('Could not load courses'); 
            const courses = await response.json();                          

            const tableBody = document.querySelector('#courses');         
            tableBody.replaceChildren();

            for (const course of courses) {                                 
                const row = document.createElement('tr');
                for (const value of [course.code, course.title, course.credits]) {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.appendChild(cell);
                }
                tableBody.appendChild(row);
            }
        } catch (error) {
            alert(error.message);
        }
}
);


</script>

</body>
</html>
